name: 质量检查
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: '0.12.22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
      - run: pnpm check
      - run: uv run ruff check backend api tests scripts
      - run: uv run ruff format --check backend api tests scripts
      - run: uv run pytest -m 'not e2e'
      - run: uv run python -m scripts.export_examples /tmp/examples.json
      - run: node scripts/check_examples.mjs /tmp/examples.json
      - run: go run scripts/check_examples.go /tmp/examples.json
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/run_e2e.py
