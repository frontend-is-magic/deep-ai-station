name: 质量检查
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: '0.12.22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
      - run: pnpm check
      - run: uv run ruff check backend api tests scripts
      - run: uv run ruff format --check backend api tests scripts
      - run: uv run pytest -m 'not e2e'
      - run: uv run python scripts/check_secrets.py
      - run: uv run python -m scripts.export_examples /tmp/examples.json
      - run: node scripts/check_examples.mjs /tmp/examples.json
      - run: go run scripts/check_examples.go /tmp/examples.json
      - run: uv run python -m scripts.compile_go_examples
      - run: uv run python scripts/build_starters.py --check
      - run: pnpm --dir starters/frontend install --frozen-lockfile
      - run: pnpm --dir starters/frontend check
      - run: node --test src/response.test.mjs
        working-directory: starters/frontend
      - run: pnpm --dir starters/typescript install --frozen-lockfile
      - run: pnpm --dir starters/typescript check
      - run: uv sync --locked --project starters/python
      - run: uv run --project starters/python ruff check starters/python
      - run: uv run --project starters/python ruff format --check starters/python
      - run: uv run --project starters/python pytest starters/python
      - run: uv sync --locked --project starters/agent
      - run: uv run --project starters/agent ruff check starters/agent
      - run: uv run --project starters/agent ruff format --check starters/agent
      - run: uv run --project starters/agent pytest starters/agent
      - run: go test -C starters/go -mod=readonly ./...
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/run_starter_e2e.py
      - run: uv run python scripts/run_e2e.py
