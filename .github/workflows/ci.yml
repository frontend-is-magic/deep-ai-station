name: 质量检查
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: '0.12.22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
      - run: pnpm check
      - run: uv run ruff check backend api tests scripts
      - run: uv run ruff format --check backend api tests scripts
      - run: uv run pytest -m 'not e2e'
      - run: uv run python scripts/check_secrets.py
      - run: uv run python -m scripts.export_examples /tmp/examples.json
      - run: node scripts/check_examples.mjs /tmp/examples.json
      - run: go run scripts/check_examples.go /tmp/examples.json
      - run: uv run python -m scripts.compile_go_examples
      - run: uv run python scripts/build_starters.py --check
      - run: pnpm --dir starters/frontend install --frozen-lockfile
      - run: pnpm --dir starters/frontend check
      - run: node --test src/response.test.mjs
        working-directory: starters/frontend
      - run: pnpm --dir starters/typescript install --frozen-lockfile
      - run: pnpm --dir starters/typescript check
      - run: uv run python scripts/check_starter_archives.py
      - run: uv sync --locked --project starters/python
      - run: uv run --project starters/python ruff check starters/python
      - run: uv run --project starters/python ruff format --check starters/python
      - run: uv run --project starters/python pytest starters/python
      - run: uv sync --locked --project starters/agent
      - run: uv run --project starters/agent ruff check starters/agent
      - run: uv run --project starters/agent ruff format --check starters/agent
      - run: uv run --project starters/agent pytest starters/agent
      - run: go test -C starters/go -mod=readonly ./...
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/verify_stream_labs.py --browser
      - run: uv run python scripts/run_starter_e2e.py
      - run: uv run python scripts/run_e2e.py
  course-labs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, typescript, go]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.22'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: labs/**/python/uv.lock
      - uses: pnpm/action-setup@v4
        if: matrix.language == 'typescript'
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        if: matrix.language == 'typescript'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: labs/**/typescript/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        if: matrix.language == 'go'
        with:
          go-version: '1.27.1'
          cache: false
      - run: uv run --no-project --python 3.12 python scripts/build_course_labs.py --check
      - run: uv run --no-project --python 3.12 python scripts/verify_course_labs.py --language ${{ matrix.language }}
      - run: uv run --no-project --python 3.12 python scripts/verify_sqlite_labs.py --language ${{ matrix.language }}
      - run: uv run --no-project --python 3.12 python scripts/verify_session_labs.py --language ${{ matrix.language }}
      - run: uv run --no-project --python 3.12 python scripts/verify_upload_labs.py --language ${{ matrix.language }}
  agent-write-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.22'
          python-version: '3.12'
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: labs/agent-write-safety/shared/client/pnpm-lock.yaml
      - run: uv sync --locked
      - run: uv run python scripts/build_course_labs.py --check
      - run: uv run python scripts/verify_agent_write_lab.py
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/verify_agent_write_lab.py --browser
  mcp-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.22'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: labs/mcp-readonly/python/uv.lock
      - run: uv run --no-project --python 3.12 python scripts/build_course_labs.py --check
      - run: uv run --no-project --python 3.12 python scripts/verify_mcp_lab.py
  checkpoint-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.22'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: labs/workflow-checkpoint/python/uv.lock
      - run: uv run --no-project --python 3.12 python scripts/build_course_labs.py --check
      - run: uv run --no-project --python 3.12 python scripts/verify_checkpoint_lab.py
  chunking-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.22'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: labs/document-chunking/python/uv.lock
      - run: uv run --no-project --python 3.12 python scripts/build_course_labs.py --check
      - run: uv run --no-project --python 3.12 python scripts/verify_chunking_lab.py
  output-regression-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.22'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: labs/output-regression/python/uv.lock
      - run: uv run --no-project --python 3.12 python scripts/build_course_labs.py --check
      - run: uv run --no-project --python 3.12 python scripts/verify_output_regression_lab.py
  shared-quota:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: quota-test-only
          POSTGRES_DB: deep_ai_quota_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deep_ai_quota_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Public, disposable CI database; never a managed deployment credential.
      TEST_QUOTA_DATABASE_URL: postgresql://postgres:quota-test-only@localhost:5432/deep_ai_quota_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.22'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -c "import os; assert os.environ.get('TEST_QUOTA_DATABASE_URL')"
      - run: uv run pytest tests/test_quota_postgres.py tests/test_model_usage_postgres.py tests/test_model_usage_api_postgres.py -q -rs
