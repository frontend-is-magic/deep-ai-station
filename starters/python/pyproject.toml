[project]
name = "ai-knowledge-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.135.4", "uvicorn==0.41.0", "httpx==0.28.1"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.15.22"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
