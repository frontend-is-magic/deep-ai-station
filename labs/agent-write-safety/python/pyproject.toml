[project]
name = "agent-write-safety-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.135.4", "uvicorn==0.41.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.15.22"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test_app.py"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]
