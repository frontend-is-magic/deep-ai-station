[project]
name = "deep-ai-station"
version = "0.1.0"
description = "AI engineering learning API"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.135,<0.136", "uvicorn>=0.41,<0.42", "httpx>=0.28,<0.29", "defusedxml>=0.7,<0.8"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
    "pytest-asyncio>=1.3,<2",
    "playwright>=1.63.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["e2e: headless browser acceptance against the local running app"]
